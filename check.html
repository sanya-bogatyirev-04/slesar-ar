<!doctype html>
<meta charset="utf-8">
<title>Проверка модели</title>
<p>Сверка JavaScript-модели с эталоном algorithm/model.py (Python).</p>
<pre id="out">считаю…</pre>
<script type="module">
  import { Model, DEFAULT_CONFIG, STRATEGIES } from "./js/model.js";
  // эталон — algorithm/model.py (точное решение и Монте-Карло 20 000 дней)
  const PY = { team_fifo: 89292, solo6_fifo: 109972, team_prio: 61990, solo6_prio: 102457, split_fifo: 96156, adaptive: 61990 };
  const m = new Model(DEFAULT_CONFIG);
  const t0 = performance.now();
  const res = await m.runAll(10000, 2026);
  const lines = [];
  let ok = true;
  for (const s of STRATEGIES) {
    const r = res.results[s.key];
    const js = r.exact ? r.exact.lossMean : r.sim.lossMean;
    const tol = r.exact ? 1 : 3 * r.sim.lossCI + 300;
    const pass = Math.abs(js - PY[s.key]) <= tol;
    ok &&= pass;
    lines.push(`${pass ? "OK  " : "FAIL"} ${s.key.padEnd(11)} JS=${js.toFixed(0)} PY=${PY[s.key]}  MC=${r.sim.lossMean.toFixed(0)}±${r.sim.lossCI.toFixed(0)}`);
  }
  lines.push(`delta=${res.main.delta.toFixed(0)} руб/день, fire=${res.main.fire}, ${(performance.now() - t0).toFixed(0)} мс`);
  lines.push(ok ? "ALL OK" : "MISMATCH");
  document.getElementById("out").textContent = lines.join("\n");
  window.__done = lines.join("\n");
</script>
<p>Реплики персонажей (js/lines.json): ни в одной версии нет мата, у каждой реплики есть озвучка с тем же текстом.</p>
<pre id="out-lines">проверяю…</pre>
<script type="module">
  // корни нецензурной лексики (проверяются и субтитр t, и текст для голоса s — без знаков ударения «+»)
  const BAD = /(^|[^а-яё])(бля(?!х)|[её]б|хер(?!с))|ёб|за[её]б|на[её]б|у[её]б|от[ъь]?[её]б|вы[её]б|по[её]б|съ[её]б|ебан|ебуч|ебат|ебал|хуй|хуё|хуе|хуя|хуи|пизд|муда|мудо|залуп|сук[аи](?![а-яё])|ссы|сра[лт]|обоср|ёпт|говн|жоп|херак/i;
  const L = await fetch("js/lines.json").then((r) => r.json());
  const M = await fetch("assets/voice/voice-manifest.json").then((r) => (r.ok ? r.json() : { items: {} }));
  const out = [];
  let ok = true;
  for (const set of ["classic", "adult"]) {
    let n = 0, bad = 0, miss = 0;
    for (const [cat, arr] of Object.entries(L[set])) for (const l of arr) {
      n++;
      for (const f of ["t", "s"]) if (l[f] && BAD.test(l[f].replace(/\+/g, "").toLowerCase())) { bad++; out.push(`МАТ  ${l.id}: ${l[f]}`); }
      const it = M.items[l.id];
      if (!it || it.text !== (l.s || l.t)) { miss++; out.push(`ГОЛОС ${l.id}: нет файла или текст не совпадает`); }
    }
    ok &&= !bad && !miss;
    out.push(`${!bad && !miss ? "OK  " : "FAIL"} ${set.padEnd(8)} реплик ${n}, мат ${bad}, без озвучки ${miss}`);
  }
  out.push(ok ? "LINES OK" : "LINES MISMATCH");
  document.getElementById("out-lines").textContent = out.join("\n");
  window.__lines = out.join("\n");
</script>
