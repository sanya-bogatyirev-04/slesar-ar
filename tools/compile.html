<!doctype html>
<meta charset="utf-8">
<title>Компиляция метки</title>
<pre id="out">компилирую…</pre>
<script type="module">
  import { Compiler } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js";
  const out = document.getElementById("out");
  try {
    const img = new Image();
    img.src = "../assets/marker.png?" + Date.now();
    await img.decode();
    const compiler = new Compiler();
    await compiler.compileImageTargets([img], (p) => (out.textContent = "компилирую… " + p.toFixed(0) + "%"));
    const buf = await compiler.exportData();
    const r = await fetch("/save/marker.mind", { method: "PUT", body: buf });
    window.__done = out.textContent = await r.text();
  } catch (e) {
    window.__done = out.textContent = "ERROR " + e;
  }
</script>
